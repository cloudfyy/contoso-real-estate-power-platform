name: _Validate Azure API and Infrastructure

permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Azure API and Bicep

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore Payments API
      run: dotnet restore src/azure-api/Contoso.API.Payments.sln

    - name: Build Payments API
      run: dotnet build src/azure-api/Contoso.API.Payments.sln --configuration Release --no-restore

    - name: Install Bicep CLI
      run: az bicep install

    - name: Build Bicep template
      run: az bicep build --file infra/main.bicep --stdout > $RUNNER_TEMP/main.json