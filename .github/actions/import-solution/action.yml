name: Import Power Platform solution
inputs:
  solutionName:
    required: true
  targetName:
    required: false
    default: ''
  overrideVersionTag:
    required: false
    default: ''
  stageAndUpgrade:
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Install semver
      run: npm install semver
      shell: pwsh

    - name: Get Most Recent Release Matching Regex
      id: get_release
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const semver = require('semver');
          const solutionName = '${{ inputs.solutionName }}';
          const overrideVersionTag = '${{ inputs.overrideVersionTag }}';
          const regexPattern = overrideVersionTag ? `^${overrideVersionTag}$` : `^v\\d+\\.\\d+\\.\\d+(-${solutionName})$`;
          console.log(regexPattern);
          const regex = new RegExp(regexPattern);
          const { data: releases } = await github.rest.repos.listReleases({
            owner: context.repo.owner,
            repo: context.repo.repo,
          });
          console.log(`Found ${releases.length} releases.`);

          const matchingReleases = releases.filter(release => !release.draft && regex.test(release.tag_name));
          console.log(`Found ${matchingReleases.length} matching releases.`);
          const mostRecentRelease = matchingReleases.sort((a, b) => semver.compare(a.tag_name, b.tag_name)).pop();

          if (mostRecentRelease) {
            core.setOutput('release_id', mostRecentRelease.id);
            core.setOutput('tag_name', mostRecentRelease.tag_name);
            console.log(`Found release: ${mostRecentRelease.tag_name}`);

            fs.mkdirSync(solutionName, { recursive: true });
            for (const asset of mostRecentRelease.assets) {
              const assetData = await github.request('GET ' + asset.url, {
                headers: {
                  Accept: 'application/octet-stream',
                },
              });
              const outputPath = path.join(process.env.GITHUB_WORKSPACE, solutionName, asset.name);
              fs.writeFileSync(outputPath, Buffer.from(assetData.data));
              console.log(`Downloaded ${asset.name} to ${outputPath}`);
            }
          } else {
            core.setFailed('No matching release found.');
          }

    - name: Inject Deployment Settings (Work around for some configuration not updatable in deployment Settings)
      if: inputs.solutionName == 'ContosoRealEstateCore' || inputs.solutionName == 'ContosoRealEstatePortal'
      run: |
        $solutionFilePath = '${{ inputs.solutionName }}/${{ inputs.solutionName }}_managed.zip'
        $scriptPath = '.\src\core\solution\deployment-scripts\inject-configuration-into-solution.ps1'
        $scriptArguments = @{
          solutionFilePath = $solutionFilePath
          pluginManagedIdentityAppId = $env:PLUGIN_MANAGED_IDENTITY_APP_ID
          tenantId = $env:PAC_DEPLOY_AZURE_TENANT_ID
        }
        if (-not [string]::IsNullOrWhiteSpace($env:OVERRIDE_PLUGIN_MANAGED_IDENTITY_ID)) {
          $scriptArguments.overridePluginManagedIdentityId = $env:OVERRIDE_PLUGIN_MANAGED_IDENTITY_ID
        }
        Write-Host "Running script: $scriptPath"
        & $scriptPath @scriptArguments
      shell: pwsh
      working-directory: ${{ github.workspace }}

    - name: Install pac
      uses: microsoft/powerplatform-actions/actions-install@v1
      with:
        add-tools-to-path: true

    - name: Auth pac
      run: |
        if ([string]::IsNullOrWhiteSpace($env:PAC_DEPLOY_ENV_URL)) { throw 'PAC_DEPLOY_ENV_URL is empty.' }
        if ([string]::IsNullOrWhiteSpace($env:PAC_DEPLOY_AZURE_TENANT_ID)) { throw 'PAC_DEPLOY_AZURE_TENANT_ID is empty.' }
        if ([string]::IsNullOrWhiteSpace($env:PAC_DEPLOY_CLIENT_ID)) { throw 'PAC_DEPLOY_CLIENT_ID is empty.' }
        pac auth create --githubFederated --tenant $env:PAC_DEPLOY_AZURE_TENANT_ID --applicationId $env:PAC_DEPLOY_CLIENT_ID --environment $env:PAC_DEPLOY_ENV_URL
      shell: pwsh

    - name: Set Environment Settings
      run: |
        $configJson = $env:PAC_DEPLOY_CONFIG
        $configObj = ConvertFrom-Json $configJson
        $solutionName = '${{ inputs.solutionName }}'
        $environmentSettings = $configObj.$solutionName.environmentSettings
        if ($environmentSettings -ne $null -and $environmentSettings -ne '') {
          foreach ($setting in $environmentSettings.PSObject.Properties) {
              Write-Host "Updating setting '$($setting.Name)' to '$($setting.Value)'" -ForegroundColor Green
              pac env update-settings --name $setting.Name --value $setting.Value
          }
        } else {
          Write-Host 'No environment settings found' -ForegroundColor Yellow
        }
      shell: pwsh

    - name: Resolve Portal Connection References
      if: inputs.solutionName == 'ContosoRealEstatePortal'
      run: |
        function Get-ConnectionId {
          param (
            [string]$ApiIdPrefix,
            [string]$DisplayName
          )

          $connectionOutput = pac connection list --environment $env:PAC_DEPLOY_ENV_URL
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to list Power Platform connections for '$env:PAC_DEPLOY_ENV_URL'."
          }

          foreach ($line in $connectionOutput) {
            $trimmedLine = ([string]$line).Trim()
            if ($trimmedLine -notmatch '^[a-fA-F0-9]{32}\s+') {
              continue
            }

            $columns = @($trimmedLine -split '\s{2,}')
            if ($columns.Count -lt 4) {
              continue
            }

            if ($columns[2].StartsWith($ApiIdPrefix) -and $columns[3] -eq 'Connected') {
              Write-Host "Using connection '$($columns[1])' for $DisplayName." -ForegroundColor Green
              return $columns[0]
            }
          }

          throw "No connected '$DisplayName' connection was found in '$env:PAC_DEPLOY_ENV_URL'. Create the connection once in the Portal Dev environment, then rerun this deployment."
        }

        if ([string]::IsNullOrWhiteSpace($env:PAYMENTS_API_CLIENT_SECRET)) {
          throw 'PAYMENTS_API_CLIENT_SECRET is not configured on the GitHub deployment environment. Rerun scripts/configure-github-deployment-environment.ps1 to write it.'
        }

        $configObj = ConvertFrom-Json $env:PAC_DEPLOY_CONFIG
        $portalSettings = $configObj.ContosoRealEstatePortal.deploymentSettings
        if ($portalSettings -eq $null) {
          throw 'PAC_DEPLOY_CONFIG does not contain ContosoRealEstatePortal deployment settings.'
        }

        $connectionIds = @{
          contoso_PortalBotQueries = Get-ConnectionId `
            -ApiIdPrefix '/providers/Microsoft.PowerApps/apis/shared_commondataserviceforapps' `
            -DisplayName 'Dataverse'
          contoso_StripeAPI = Get-ConnectionId `
            -ApiIdPrefix '/providers/Microsoft.PowerApps/apis/shared_contoso-5fcontoso-20stripe-20api' `
            -DisplayName 'Contoso Stripe API'
        }

        pac connection update `
          --environment $env:PAC_DEPLOY_ENV_URL `
          --tenant-id $env:PAC_DEPLOY_AZURE_TENANT_ID `
          --connection-id $connectionIds.contoso_StripeAPI `
          --application-id $env:PLUGIN_MANAGED_IDENTITY_APP_ID `
          --client-secret $env:PAYMENTS_API_CLIENT_SECRET
        if ($LASTEXITCODE -ne 0) {
          throw 'Failed to update the Contoso Stripe API connection with the Payments API client secret.'
        }

        foreach ($connectionReference in $portalSettings.ConnectionReferences) {
          if ($connectionIds.ContainsKey($connectionReference.LogicalName)) {
            $connectionReference.ConnectionId = $connectionIds[$connectionReference.LogicalName]
          }
        }

        $portalSettings | ConvertTo-Json -Depth 100 | Out-File -FilePath './ContosoRealEstatePortal/deployment_settings.json' -Encoding UTF8
      shell: pwsh
      working-directory: .

    - name: Import Solution
      run: |
        $configObj = ConvertFrom-Json $env:PAC_DEPLOY_CONFIG
        $solutionName = '${{ inputs.solutionName }}'
        $deploymentSettings = $configObj.$solutionName.deploymentSettings
        $deploymentSettingsFileName = "./$solutionName/deployment_settings.json"
        if ($deploymentSettings -ne $null -and $deploymentSettings -ne '') {
          if (-not (Test-Path -Path $deploymentSettingsFileName)) {
            $deploymentSettingsJson = $deploymentSettings | ConvertTo-Json -Depth 100
            Write-Host "Deployment settings file: $deploymentSettingsFileName"
            Write-Host $deploymentSettingsJson
            $deploymentSettingsJson | Out-File -FilePath $deploymentSettingsFileName -Encoding UTF8
          }
          $settingsFileArg = "--settings-file $deploymentSettingsFileName"
        } else {
          Write-Host 'No deployment settings found'
          $settingsFileArg = ''
        }

        $stageAndUpgradeArg = ''
        if ('${{ inputs.stageAndUpgrade }}' -eq 'true') {
          $stageAndUpgradeArg = '--stage-and-upgrade'
        }

        $command = "pac solution import $stageAndUpgradeArg --activate-plugins --skip-lower-version --async --path ${{ inputs.solutionName }}/${{ inputs.solutionName }}_managed.zip $settingsFileArg"
        Write-Host "Running command: $command"
        Invoke-Expression $command
      shell: pwsh
      working-directory: .

    - name: Import Data Files
      run: |
        $configObj = ConvertFrom-Json $env:PAC_DEPLOY_CONFIG
        $solutionName = '${{ inputs.solutionName }}'
        $dataFiles = $configObj.$solutionName.data
        if ($dataFiles -ne $null -and $dataFiles -ne '') {
          foreach ($file in $dataFiles) {
            $filePath = "$solutionName/$file".Trim()
            Write-Host "Importing data from $filePath"
            pac data import --data $filePath
          }
        } else {
          Write-Host 'No data files found'
        }
      shell: pwsh
      working-directory: .
