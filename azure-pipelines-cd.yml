name: cd-$(Date:yyyyMMdd).$(Rev:r)

trigger: none
pr: none

parameters:
  - name: stageAndUpgrade
    displayName: Stage and upgrade imported solutions
    type: boolean
    default: true

resources:
  pipelines:
    - pipeline: ci
      source: contoso-real-estate-ci
      trigger: none

variables:
  - group: contoso-real-estate-cd-development

pool:
  vmImage: windows-latest

stages:
  - stage: Deploy_Development
    displayName: Deploy development
    jobs:
      - deployment: DeployPowerPlatformSolutions
        displayName: Deploy Power Platform solutions
        environment: development
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: '0'

                - download: ci
                  artifact: solution-packages

                - task: PowerPlatformToolInstaller@2
                  displayName: Install Power Platform CLI
                  inputs:
                    DefaultVersion: true
                    AddToolsToPath: true

                - pwsh: |
                    $pacCommand = Get-Command pac -ErrorAction Stop
                    $pacPath = if ($pacCommand.Source) { $pacCommand.Source } else { $pacCommand.Path }
                    Write-Host "Power Platform CLI: $pacPath"
                    pac help
                  displayName: Resolve Power Platform CLI

                - pwsh: |
                    $arguments = @{
                      ArtifactRoot = '$(Pipeline.Workspace)/ci/solution-packages'
                      DeploymentRoot = '$(Pipeline.Workspace)/deploy'
                      ValidateOnly = $true
                    }

                    ./scripts/azure-devops/deploy-power-platform-solutions.ps1 @arguments
                  displayName: Validate CD configuration
                  env:
                    PAC_DEPLOY_AZURE_TENANT_ID: $(PAC_DEPLOY_AZURE_TENANT_ID)
                    PAC_DEPLOY_CLIENT_ID: $(PAC_DEPLOY_CLIENT_ID)
                    PAC_DEPLOY_CLIENT_SECRET: $(PAC_DEPLOY_CLIENT_SECRET)
                    PAC_DEPLOY_CORE_ENV_URL: $(PAC_DEPLOY_CORE_ENV_URL)
                    PAC_DEPLOY_PORTAL_ENV_URL: $(PAC_DEPLOY_PORTAL_ENV_URL)
                    PLUGIN_MANAGED_IDENTITY_APP_ID: $(PLUGIN_MANAGED_IDENTITY_APP_ID)
                    PAYMENTS_API_CLIENT_SECRET: $(PAYMENTS_API_CLIENT_SECRET)
                    PAC_DEPLOY_CONFIG: $(PAC_DEPLOY_CONFIG)
                    OVERRIDE_PLUGIN_MANAGED_IDENTITY_ID: $(OVERRIDE_PLUGIN_MANAGED_IDENTITY_ID)

                - pwsh: |
                    $arguments = @{
                      ArtifactRoot = '$(Pipeline.Workspace)/ci/solution-packages'
                      DeploymentRoot = '$(Pipeline.Workspace)/deploy'
                      TargetName = 'core'
                      SolutionName = 'ContosoRealEstateCustomControls'
                    }
                    if ([System.Convert]::ToBoolean('${{ parameters.stageAndUpgrade }}')) {
                      $arguments.StageAndUpgrade = $true
                    }

                    ./scripts/azure-devops/deploy-power-platform-solutions.ps1 @arguments
                  displayName: Deploy core / ContosoRealEstateCustomControls
                  env:
                    PAC_DEPLOY_AZURE_TENANT_ID: $(PAC_DEPLOY_AZURE_TENANT_ID)
                    PAC_DEPLOY_CLIENT_ID: $(PAC_DEPLOY_CLIENT_ID)
                    PAC_DEPLOY_CLIENT_SECRET: $(PAC_DEPLOY_CLIENT_SECRET)
                    PAC_DEPLOY_CORE_ENV_URL: $(PAC_DEPLOY_CORE_ENV_URL)
                    PAC_DEPLOY_PORTAL_ENV_URL: $(PAC_DEPLOY_PORTAL_ENV_URL)
                    PLUGIN_MANAGED_IDENTITY_APP_ID: $(PLUGIN_MANAGED_IDENTITY_APP_ID)
                    PAYMENTS_API_CLIENT_SECRET: $(PAYMENTS_API_CLIENT_SECRET)
                    PAC_DEPLOY_CONFIG: $(PAC_DEPLOY_CONFIG)
                    OVERRIDE_PLUGIN_MANAGED_IDENTITY_ID: $(OVERRIDE_PLUGIN_MANAGED_IDENTITY_ID)

                - pwsh: |
                    $arguments = @{
                      ArtifactRoot = '$(Pipeline.Workspace)/ci/solution-packages'
                      DeploymentRoot = '$(Pipeline.Workspace)/deploy'
                      TargetName = 'core'
                      SolutionName = 'ContosoRealEstateCore'
                    }
                    if ([System.Convert]::ToBoolean('${{ parameters.stageAndUpgrade }}')) {
                      $arguments.StageAndUpgrade = $true
                    }

                    ./scripts/azure-devops/deploy-power-platform-solutions.ps1 @arguments
                  displayName: Deploy core / ContosoRealEstateCore
                  env:
                    PAC_DEPLOY_AZURE_TENANT_ID: $(PAC_DEPLOY_AZURE_TENANT_ID)
                    PAC_DEPLOY_CLIENT_ID: $(PAC_DEPLOY_CLIENT_ID)
                    PAC_DEPLOY_CLIENT_SECRET: $(PAC_DEPLOY_CLIENT_SECRET)
                    PAC_DEPLOY_CORE_ENV_URL: $(PAC_DEPLOY_CORE_ENV_URL)
                    PAC_DEPLOY_PORTAL_ENV_URL: $(PAC_DEPLOY_PORTAL_ENV_URL)
                    PLUGIN_MANAGED_IDENTITY_APP_ID: $(PLUGIN_MANAGED_IDENTITY_APP_ID)
                    PAYMENTS_API_CLIENT_SECRET: $(PAYMENTS_API_CLIENT_SECRET)
                    PAC_DEPLOY_CONFIG: $(PAC_DEPLOY_CONFIG)
                    OVERRIDE_PLUGIN_MANAGED_IDENTITY_ID: $(OVERRIDE_PLUGIN_MANAGED_IDENTITY_ID)

                - pwsh: |
                    $arguments = @{
                      ArtifactRoot = '$(Pipeline.Workspace)/ci/solution-packages'
                      DeploymentRoot = '$(Pipeline.Workspace)/deploy'
                      TargetName = 'portal'
                      SolutionName = 'ContosoRealEstateCustomControls'
                    }
                    if ([System.Convert]::ToBoolean('${{ parameters.stageAndUpgrade }}')) {
                      $arguments.StageAndUpgrade = $true
                    }

                    ./scripts/azure-devops/deploy-power-platform-solutions.ps1 @arguments
                  displayName: Deploy portal / ContosoRealEstateCustomControls
                  env:
                    PAC_DEPLOY_AZURE_TENANT_ID: $(PAC_DEPLOY_AZURE_TENANT_ID)
                    PAC_DEPLOY_CLIENT_ID: $(PAC_DEPLOY_CLIENT_ID)
                    PAC_DEPLOY_CLIENT_SECRET: $(PAC_DEPLOY_CLIENT_SECRET)
                    PAC_DEPLOY_CORE_ENV_URL: $(PAC_DEPLOY_CORE_ENV_URL)
                    PAC_DEPLOY_PORTAL_ENV_URL: $(PAC_DEPLOY_PORTAL_ENV_URL)
                    PLUGIN_MANAGED_IDENTITY_APP_ID: $(PLUGIN_MANAGED_IDENTITY_APP_ID)
                    PAYMENTS_API_CLIENT_SECRET: $(PAYMENTS_API_CLIENT_SECRET)
                    PAC_DEPLOY_CONFIG: $(PAC_DEPLOY_CONFIG)
                    OVERRIDE_PLUGIN_MANAGED_IDENTITY_ID: $(OVERRIDE_PLUGIN_MANAGED_IDENTITY_ID)

                - pwsh: |
                    $arguments = @{
                      ArtifactRoot = '$(Pipeline.Workspace)/ci/solution-packages'
                      DeploymentRoot = '$(Pipeline.Workspace)/deploy'
                      TargetName = 'portal'
                      SolutionName = 'ContosoRealEstateCore'
                    }
                    if ([System.Convert]::ToBoolean('${{ parameters.stageAndUpgrade }}')) {
                      $arguments.StageAndUpgrade = $true
                    }

                    ./scripts/azure-devops/deploy-power-platform-solutions.ps1 @arguments
                  displayName: Deploy portal / ContosoRealEstateCore
                  env:
                    PAC_DEPLOY_AZURE_TENANT_ID: $(PAC_DEPLOY_AZURE_TENANT_ID)
                    PAC_DEPLOY_CLIENT_ID: $(PAC_DEPLOY_CLIENT_ID)
                    PAC_DEPLOY_CLIENT_SECRET: $(PAC_DEPLOY_CLIENT_SECRET)
                    PAC_DEPLOY_CORE_ENV_URL: $(PAC_DEPLOY_CORE_ENV_URL)
                    PAC_DEPLOY_PORTAL_ENV_URL: $(PAC_DEPLOY_PORTAL_ENV_URL)
                    PLUGIN_MANAGED_IDENTITY_APP_ID: $(PLUGIN_MANAGED_IDENTITY_APP_ID)
                    PAYMENTS_API_CLIENT_SECRET: $(PAYMENTS_API_CLIENT_SECRET)
                    PAC_DEPLOY_CONFIG: $(PAC_DEPLOY_CONFIG)
                    OVERRIDE_PLUGIN_MANAGED_IDENTITY_ID: $(OVERRIDE_PLUGIN_MANAGED_IDENTITY_ID)

                - pwsh: |
                    $arguments = @{
                      ArtifactRoot = '$(Pipeline.Workspace)/ci/solution-packages'
                      DeploymentRoot = '$(Pipeline.Workspace)/deploy'
                      TargetName = 'portal'
                      SolutionName = 'ContosoRealEstatePortal'
                    }
                    if ([System.Convert]::ToBoolean('${{ parameters.stageAndUpgrade }}')) {
                      $arguments.StageAndUpgrade = $true
                    }

                    ./scripts/azure-devops/deploy-power-platform-solutions.ps1 @arguments
                  displayName: Deploy portal / ContosoRealEstatePortal
                  env:
                    PAC_DEPLOY_AZURE_TENANT_ID: $(PAC_DEPLOY_AZURE_TENANT_ID)
                    PAC_DEPLOY_CLIENT_ID: $(PAC_DEPLOY_CLIENT_ID)
                    PAC_DEPLOY_CLIENT_SECRET: $(PAC_DEPLOY_CLIENT_SECRET)
                    PAC_DEPLOY_CORE_ENV_URL: $(PAC_DEPLOY_CORE_ENV_URL)
                    PAC_DEPLOY_PORTAL_ENV_URL: $(PAC_DEPLOY_PORTAL_ENV_URL)
                    PLUGIN_MANAGED_IDENTITY_APP_ID: $(PLUGIN_MANAGED_IDENTITY_APP_ID)
                    PAYMENTS_API_CLIENT_SECRET: $(PAYMENTS_API_CLIENT_SECRET)
                    PAC_DEPLOY_CONFIG: $(PAC_DEPLOY_CONFIG)
                    OVERRIDE_PLUGIN_MANAGED_IDENTITY_ID: $(OVERRIDE_PLUGIN_MANAGED_IDENTITY_ID)